precision: bf16-mixed
device: auto
num_workers: 8
num_threads: 1
seed: 42
wandb_project: kraken

train:
  arch: ppocrv6
  variant: medium
  format_type: binary
  training_data:
    - train.lst
  evaluation_data:
    - val.lst
  checkpoint_path: checkpoints
  weights_format: safetensors
  height: 96
  max_width: 2560 
  padding: 16
  normalization: NFD
  augment: true
  optimizer: AdamW+Muon
  batch_size: 128
  accumulate_grad_batches: 1
  lrate: 1.2e-3
  weight_decay: 0.01
  gradient_clip_val: 1.0
  quit: fixed
  epochs: 12
  schedule: cosine
  warmup: 3000
  cos_min_lr: 1e-5
  cos_t_max: 12
  freq: 1.0
  pl_logger: wandb 
